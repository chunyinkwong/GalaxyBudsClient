name: Compile iOS (unsigned IPA)

on:
  # Manual dispatch only: nothing runs automatically on push/pull_request/release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Show environment
        run: |
          dotnet --info
          xcodebuild -version

      - name: Restore
        run: >
          dotnet restore GalaxyBudsClient.iOS/GalaxyBudsClient.iOS.csproj
          -r ios-arm64
          -p:IsIOS=true
          --configfile GalaxyBudsClient/nuget.config

      - name: Publish (unsigned, device arm64)
        run: >
          dotnet publish GalaxyBudsClient.iOS/GalaxyBudsClient.iOS.csproj
          -f net10.0-ios
          -c Release
          -r ios-arm64
          -o bin_ios
          --no-restore
          -p:IsIOS=true
          -p:EnableCodeSigning=false
          -p:CodesignRequireProvisioningProfile=false

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # dotnet publish packages the app bundle into an IPA; it does not
          # necessarily leave a standalone .app directory in the output.
          PUBLISHED_IPA="$(find bin_ios -name '*.ipa' -type f -print -quit)"
          if [ -z "${PUBLISHED_IPA}" ]; then
            echo "::error::No IPA was produced"
            exit 1
          fi
          echo "Published IPA: ${PUBLISHED_IPA}"
          if ! unzip -Z1 "${PUBLISHED_IPA}" | grep -q '^Payload/[^/]*\.app/'; then
            echo "::error::Published IPA does not contain an app bundle"
            exit 1
          fi
          # The FluentAvalonia glyph font ("Seagull Fluent Icons") is embedded in
          # FluentIcons.Resources.Avalonia.dll and is only referenced through avares:// URI strings, so
          # ILLink drops the assembly unless it is rooted (see the TrimmerRootAssembly entry in
          # GalaxyBudsClient.iOS.csproj). Without it the first FontIcon measure aborts the app with
          # "Could not create glyphTypeface" -> SIGABRT. Fail the build instead of shipping that IPA.
          if ! unzip -Z1 "${PUBLISHED_IPA}" | grep -q 'FluentIcons.Resources.Avalonia.dll'; then
            echo "::error::FluentIcons.Resources.Avalonia.dll is missing from the app bundle (trimmed away); glyph icons would crash the app on first layout"
            exit 1
          fi
          cp "${PUBLISHED_IPA}" GalaxyBudsClient-ios-unsigned.ipa
          ls -lh GalaxyBudsClient-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: GalaxyBudsClient-ios-unsigned
          path: GalaxyBudsClient-ios-unsigned.ipa
          if-no-files-found: error
